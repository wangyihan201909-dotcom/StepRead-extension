<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <title>StepRead · 布局核对</title>
    <link rel="stylesheet" href="../src/reader/reader.css?v=head1">
    <style>
      body { overflow: auto; height: auto; padding: 20px; }
      .harness-label { font-size: 12px; color: var(--muted); margin: 0 0 6px; }
      .row { display: flex; gap: 28px; align-items: flex-start; flex-wrap: wrap; }
      .sidebar { width: 238px; padding: 10px; background: var(--panel-bg);
                 border: 1px dashed var(--control-border); display: flex; flex-direction: column; }
    </style>
  </head>
  <body>
    <div class="row">
      <div>
        <p class="harness-label">文档页 · 加号并进 tab 行右侧，不再独占一行</p>
        <aside class="sidebar">
          <div id="sidebarHead" class="sidebar-head">
            <div class="sidebar-tabs" role="tablist">
              <button class="sidebar-tab" type="button" role="tab" aria-selected="true"><span>文档</span></button>
              <button class="sidebar-tab" type="button" role="tab" aria-selected="false">
                <span>目录</span><small class="sidebar-tab-count">6</small>
              </button>
            </div>
            <button class="secondary icon-add-button" type="button" title="新建文件夹">+</button>
          </div>
          <!-- folder-heading 在实际代码里是 div，不是 button -->
          <div class="document-list">
            <div class="folder-heading"><span></span><span>about:blank</span><span></span></div>
            <div class="folder-heading"><span></span><span>雁丘词</span><span></span></div>
          </div>
        </aside>
      </div>

      <div>
        <p class="harness-label">目录页 · 加号应消失（没有文件夹可建）</p>
        <aside class="sidebar">
          <div class="sidebar-head toc-active">
            <div class="sidebar-tabs" role="tablist">
              <button class="sidebar-tab" type="button" role="tab" aria-selected="false"><span>文档</span></button>
              <button class="sidebar-tab" type="button" role="tab" aria-selected="true">
                <span>目录</span><small class="sidebar-tab-count">6</small>
              </button>
            </div>
            <button class="secondary icon-add-button" type="button" title="新建文件夹">+</button>
          </div>
          <ol class="toc-list">
            <li class="toc-item"><button class="toc-link" type="button">一、不存在一个"我们"</button></li>
          </ol>
        </aside>
      </div>
    </div>
  </body>
</html>
