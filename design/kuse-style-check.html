<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <title>StepRead · 布局核对</title>
    <link rel="stylesheet" href="../src/reader/reader.css?v=d3">
    <style>
      body { overflow: auto; height: auto; padding: 20px; }
      .harness-label { font-size: 12px; color: var(--muted); margin: 0 0 6px; }
      .row { display: flex; gap: 28px; align-items: flex-start; flex-wrap: wrap; }
      /* 复刻 workspace 的三列，只为看分隔条上的手柄 */
      .mini-workspace {
        display: grid; grid-template-columns: 150px 6px 240px;
        height: 220px; border: 1px dashed var(--control-border);
      }
      .mini-workspace .sidebar { background: var(--panel-bg); padding: 8px; font-size: 12px; }
      .mini-workspace .document-pane { background: var(--page-bg); padding: 8px; font-size: 12px; }
    </style>
  </head>
  <body>
    <div class="row">
      <div>
        <p class="harness-label">收起手柄（展开态）· 应是吸附在分隔条上的细箭头</p>
        <div class="mini-workspace">
          <aside class="sidebar">文档 / 目录</aside>
          <div class="workspace-resizer left-resizer">
            <button id="sidebarCollapseButton" class="sidebar-collapse-button" type="button" title="收起左侧栏">‹</button>
          </div>
          <section class="document-pane">正文</section>
        </div>
      </div>

      <div>
        <p class="harness-label">收起态 · 手柄贴左边缘、始终可见</p>
        <div class="mini-workspace reader-app sidebar-collapsed" style="grid-template-columns: 0 6px 384px;">
          <aside class="sidebar"></aside>
          <div class="workspace-resizer left-resizer">
            <button class="sidebar-collapse-button" type="button" title="展开左侧栏">›</button>
          </div>
          <section class="document-pane">正文</section>
        </div>
      </div>
    </div>

    <p class="harness-label" style="margin-top:20px">知识图谱页 · 「阅读证据」应在细条里两轴居中</p>
    <iframe src="../src/knowledge/knowledge.html?v=d3" style="width:100%;height:420px;border:1px solid var(--border)"></iframe>
  </body>
</html>
