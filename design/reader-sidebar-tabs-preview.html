<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>StepRead · 左侧栏 文档/目录 tab 预览</title>
    <link id="readerCss" rel="stylesheet" href="../src/reader/reader.css">
    <!-- 预览页专用：绕开缓存，保证看到的是磁盘上最新的 reader.css -->
    <script>
      document.getElementById("readerCss").href = `../src/reader/reader.css?t=${Date.now()}`;
    </script>
    <style>
      body { margin: 0; }
      .preview-bar {
        display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
        padding: 8px 14px; border-bottom: 1px solid var(--border);
        background: var(--panel-bg); font-size: 12px; color: var(--muted);
      }
      .preview-bar b { color: var(--text); }
      .preview-shell { display: flex; height: calc(100vh - 41px); }
      .sidebar { flex: 0 0 238px; }
      .fake-doc { flex: 1 1 auto; padding: 26px; background: var(--page-bg); color: var(--muted); }
    </style>
  </head>
  <body>
    <div class="preview-bar">
      <b>左侧栏 tab 预览</b>
      <span>点「文档 / 目录」切换；←→ 方向键也能切</span>
    </div>

    <div class="preview-shell">
      <aside class="sidebar" aria-label="文档和目录">
        <div class="sidebar-tabs" role="tablist" aria-label="侧边栏内容切换">
          <button id="documentsTab" class="sidebar-tab" type="button" role="tab" aria-selected="true" aria-controls="documentsPanel" data-sidebar-tab="documents">
            <span>文档</span>
          </button>
          <button id="tocTab" class="sidebar-tab" type="button" role="tab" aria-selected="false" aria-controls="tocPanel" data-sidebar-tab="toc">
            <span>目录</span>
            <small id="tocCount" class="sidebar-tab-count">7</small>
          </button>
        </div>

        <section id="documentsPanel" class="sidebar-panel" role="tabpanel" aria-labelledby="documentsTab">
          <div class="document-actions">
            <button class="secondary icon-add-button" type="button" title="新建文件夹">+</button>
          </div>
          <div id="documentList" class="document-list">
            <div class="document-folder">
              <div class="folder-heading">
                <button class="folder-toggle" type="button">▾</button>
                <span class="folder-name">论文</span>
                <small>3</small>
              </div>
              <div class="folder-body">
                <button class="document-item active" type="button">Transformer 结构笔记.pdf</button>
                <button class="document-item" type="button">检索增强综述.pdf</button>
                <button class="document-item" type="button">状态空间模型.pdf</button>
              </div>
            </div>
            <button class="document-item" type="button">未归类：量子计算讲义.pdf</button>
            <button class="document-item" type="button">未归类：编译原理第 3 章.pdf</button>
          </div>
          <section class="trash-section">
            <button class="trash-toggle" type="button" aria-expanded="false">
              <span>回收站</span>
              <small>2</small>
            </button>
          </section>
        </section>

        <section id="tocPanel" class="sidebar-panel" role="tabpanel" aria-labelledby="tocTab" hidden>
          <p class="section-help">由标题自动生成，点击后跳转到正文对应位置。</p>
          <ol id="tocList" class="toc-list">
            <li class="toc-item">
              <div class="toc-row">
                <button class="toc-toggle" type="button">▾</button>
                <button class="toc-link" type="button">1 引言</button>
              </div>
            </li>
            <li class="toc-item">
              <div class="toc-row">
                <button class="toc-toggle" type="button">▾</button>
                <button class="toc-link" type="button">3 模型结构</button>
              </div>
              <ol class="toc-children">
                <li class="toc-item">
                  <div class="toc-row">
                    <button class="toc-toggle empty" type="button"></button>
                    <button class="toc-link" type="button">3.4 自注意力回顾</button>
                  </div>
                </li>
                <li class="toc-item">
                  <div class="toc-row">
                    <button class="toc-toggle empty" type="button"></button>
                    <button class="toc-link active" type="button">3.5 位置信息</button>
                  </div>
                </li>
                <li class="toc-item">
                  <div class="toc-row">
                    <button class="toc-toggle empty" type="button"></button>
                    <button class="toc-link" type="button">3.6 前馈网络</button>
                  </div>
                </li>
              </ol>
            </li>
            <li class="toc-item">
              <div class="toc-row">
                <button class="toc-toggle empty" type="button"></button>
                <button class="toc-link" type="button">4 训练设置</button>
              </div>
            </li>
            <li class="toc-item">
              <div class="toc-row">
                <button class="toc-toggle empty" type="button"></button>
                <button class="toc-link" type="button">5 结果与讨论</button>
              </div>
            </li>
          </ol>
        </section>
      </aside>

      <div class="fake-doc">PDF 正文区（占位）</div>
    </div>

    <script>
      const state = { sidebarTab: "documents" };
      const el = {
        documentsTab: document.getElementById("documentsTab"),
        tocTab: document.getElementById("tocTab"),
        documentsPanel: document.getElementById("documentsPanel"),
        tocPanel: document.getElementById("tocPanel")
      };

      function setSidebarTab(tab) {
        const next = tab === "toc" ? "toc" : "documents";
        state.sidebarTab = next;
        const showToc = next === "toc";
        el.documentsTab.setAttribute("aria-selected", String(!showToc));
        el.tocTab.setAttribute("aria-selected", String(showToc));
        el.documentsPanel.toggleAttribute("hidden", showToc);
        el.tocPanel.toggleAttribute("hidden", !showToc);
      }

      function handleSidebarTabKeydown(event) {
        if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
        event.preventDefault();
        const next = state.sidebarTab === "documents" ? "toc" : "documents";
        setSidebarTab(next);
        (next === "toc" ? el.tocTab : el.documentsTab).focus();
      }

      el.documentsTab.addEventListener("click", () => setSidebarTab("documents"));
      el.tocTab.addEventListener("click", () => setSidebarTab("toc"));
      el.documentsTab.addEventListener("keydown", handleSidebarTabKeydown);
      el.tocTab.addEventListener("keydown", handleSidebarTabKeydown);
    </script>
  </body>
</html>
