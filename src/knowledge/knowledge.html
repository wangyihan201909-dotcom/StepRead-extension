<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>StepRead 知识图谱</title>
    <link rel="stylesheet" href="./knowledge.css">
  </head>
  <body>
    <main class="knowledge-shell">
      <!--
        文字版摘要已经去掉：图谱问答的开场问候语就是这张图的一句话总览，
        再挂一份长文摘要只是同一件事说两遍。这里只留标题 + 状态。
      -->
      <section id="summaryPanel" class="knowledge-topbar" aria-labelledby="documentTitle">
        <div class="topbar-heading">
          <p class="eyebrow">StepRead 知识图谱</p>
          <h1 id="documentTitle">正在读取文档...</h1>
        </div>

        <p id="status" class="topbar-status" role="status">等待读取知识图谱。</p>
      </section>

      <div class="knowledge-body">
        <aside id="evidenceDrawer" class="evidence-drawer" data-collapsed="true">
          <button id="evidenceToggle" type="button" class="drawer-toggle" aria-expanded="false" aria-controls="evidenceDrawerBody">
            <span class="drawer-toggle-label">阅读证据</span>
          </button>
          <div id="evidenceDrawerBody" class="evidence-drawer-body">
            <div class="summary-strip" aria-label="阅读记录统计">
              <div><span id="highlightCount">0</span><small>历史划线</small></div>
              <div><span id="threadCount">0</span><small>问答线程</small></div>
              <div><span id="messageCount">0</span><small>对话消息</small></div>
              <div><span id="nodeCount">0</span><small>图谱切片</small></div>
            </div>
            <p class="evidence-note">切片来自你的每一轮问答，锚在划线上的和针对全文的都算；点击条目可以在画布上定位对应切片。</p>
            <div id="evidenceList" class="evidence-list">
              <p class="evidence-empty">暂无阅读证据。</p>
            </div>
          </div>
        </aside>

        <section class="graph-stage" aria-label="知识图谱画布">
          <div class="graph-toolbar">
            <button id="addNodeButton" type="button">＋ 新建切片</button>
            <button id="relayoutButton" type="button" class="secondary">重新排布</button>
            <button id="timelineButton" type="button" class="secondary">整理成时间线</button>
            <button id="fitButton" type="button" class="secondary">适应视图</button>
            <span class="toolbar-zoom">
              <button id="zoomOutButton" type="button" class="icon-button" title="缩小">－</button>
              <button id="zoomInButton" type="button" class="icon-button" title="放大">＋</button>
            </span>
            <button id="undoButton" type="button" class="secondary" disabled>撤销</button>
            <button id="reloadButton" type="button" class="secondary">读取最新记录</button>
          </div>
          <p class="graph-hint">
            拖动卡片可固定位置 · 从卡片右侧圆点拖到另一张卡片建立关联 · 点击连线可编辑关系 · 双击空白处新建切片
          </p>
          <div id="graphCanvas" class="graph-canvas"></div>
          <p id="graphEmpty" class="graph-empty" hidden>
            这份文档还没有问答切片。先回到阅读器提问（划线提问或直接对全文提问），或者点“＋ 新建切片”手动写一个。
          </p>
        </section>

        <aside id="chatPanel" class="chat-panel" data-collapsed="false" aria-label="图谱问答">
          <header class="chat-header">
            <h2>图谱问答</h2>
            <div class="chat-header-actions">
              <button id="chatClearButton" type="button" class="link-button">清空</button>
              <button
                id="chatCollapseButton"
                type="button"
                class="icon-button"
                aria-expanded="true"
                aria-controls="chatBody"
                title="收起问答窗口"
              >
                <span aria-hidden="true">›</span>
                <span class="visually-hidden">收起问答窗口</span>
              </button>
            </div>
          </header>
          <div id="chatBody" class="chat-body">
            <div id="chatFocusList" class="chat-focus-list" hidden></div>
            <div id="chatMessages" class="chat-messages">
              <p class="chat-empty">就这张图谱提问，例如：我已经问清楚了哪些概念？还有哪些没问透？</p>
            </div>
            <form id="chatForm" class="chat-composer">
              <textarea id="chatInput" rows="3" placeholder="就这张图谱提问，Ctrl + Enter 发送"></textarea>
              <div class="chat-composer-row">
                <span id="chatStatus" class="chat-status" role="status"></span>
                <button id="chatStopButton" type="button" class="secondary" hidden>停止</button>
                <button id="chatSendButton" type="submit">发送</button>
              </div>
            </form>
          </div>
        </aside>
      </div>
    </main>

    <aside id="nodeDetail" class="node-detail" hidden aria-label="切片详情">
      <header class="node-detail-header">
        <h2 id="nodeDetailTitle">切片详情</h2>
        <button id="nodeDetailClose" type="button" class="icon-button" title="关闭">
          <span aria-hidden="true">×</span>
          <span class="visually-hidden">关闭</span>
        </button>
      </header>
      <div class="node-detail-body">
        <p id="nodeDetailMeta" class="node-detail-meta"></p>
        <section id="nodeDetailQuoteSection" class="node-detail-section" hidden>
          <h3>划线原文</h3>
          <blockquote id="nodeDetailQuote"></blockquote>
        </section>
        <section id="nodeDetailQuestionSection" class="node-detail-section" hidden>
          <h3>问题</h3>
          <div id="nodeDetailQuestion" class="message-content"></div>
        </section>
        <section id="nodeDetailAnswerSection" class="node-detail-section" hidden>
          <h3>回答</h3>
          <div id="nodeDetailAnswer" class="message-content"></div>
        </section>
        <section id="nodeDetailEditSection" class="node-detail-section" hidden>
          <h3>编辑切片</h3>
          <label class="field-label" for="nodeDetailTitleInput">标题</label>
          <input id="nodeDetailTitleInput" type="text" maxlength="120">
          <label class="field-label" for="nodeDetailBodyInput">正文</label>
          <textarea id="nodeDetailBodyInput" rows="6"></textarea>
          <button id="nodeDetailSave" type="button">保存切片</button>
        </section>
      </div>
      <footer class="node-detail-actions">
        <button id="nodeDetailFocus" type="button">就这个切片继续问</button>
        <button id="nodeDetailLocate" type="button" class="secondary">在阅读器中定位</button>
        <button id="nodeDetailConvert" type="button" class="secondary" hidden>转为手动切片</button>
        <button id="nodeDetailDelete" type="button" class="danger">删除切片</button>
      </footer>
    </aside>

    <div id="edgePopover" class="edge-popover" hidden role="dialog" aria-label="编辑关联">
      <p id="edgePopoverMeta" class="edge-popover-meta"></p>
      <label class="field-label" for="edgeRelationInput">关联说明</label>
      <div class="edge-relation-row">
        <input id="edgeRelationInput" type="text" maxlength="40" placeholder="例如：前提 / 反例 / 同一个概念">
        <button id="edgeSuggestButton" type="button" class="edge-suggest-button" title="没想法时让 AI 给一个关系短语">🪄</button>
      </div>
      <div class="edge-popover-actions">
        <button id="edgeConfirmButton" type="button">保存</button>
        <button id="edgeReverseButton" type="button" class="secondary">反向</button>
        <button id="edgeDeleteButton" type="button" class="danger">删除</button>
      </div>
    </div>

    <script type="module" src="../shared/theme.js"></script>
    <script type="module" src="./knowledge.js"></script>
  </body>
</html>
